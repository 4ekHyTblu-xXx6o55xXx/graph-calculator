stages:
  - build
  - test

build:
  stage: build
  image: python:3.11-slim
  tags:
    - docker
  before_script:
    - chmod +x ./build.sh
  script:
    - ./build.sh

test:
  stage: test
  image: python:3.11-slim
  tags:
    - docker
  before_script:
    - chmod +x ./test.sh
  script:
    - ./test.sh
